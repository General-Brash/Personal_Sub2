{{define "oidc_login"}}<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>登录</title>
  {{template "oidc_styles" .}}
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>登录</h1>
      <p class="subtitle">使用你的 Sub2 账号继续授权</p>

      {{if eq .Step "email"}}
      <form method="post" action="/oauth/login/precheck" autocomplete="on">
        <input type="hidden" name="tx" value="{{.Tx}}">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">继续</button>
      </form>
      {{else}}
      {{if .HasError}}<div class="error">邮箱、密码或验证码不正确，请重试。</div>{{end}}
      <form method="post" action="/oauth/login" autocomplete="on">
        <input type="hidden" name="tx" value="{{.Tx}}">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <input type="hidden" name="email" value="{{.Email}}">
        <div class="identity">
          <span class="who">{{.Email}}</span>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        {{if .ShowTOTP}}
        <div class="field">
          <label for="totp_code">两步验证码 (TOTP)</label>
          <input id="totp_code" name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*">
        </div>
        {{end}}
        <button type="submit" class="btn btn-primary">继续</button>
        <a href="/oauth/login?tx={{.Tx}}" class="btn btn-ghost" style="display:block;text-align:center;line-height:44px;text-decoration:none;">换个账号</a>
      </form>
      {{end}}
    </div>
  </div>
</body>
</html>{{end}}
