name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      target_sha:
        description: 'Exact commit SHA to check out for a release gate'
        required: false
        type: string
      release_gate:
        description: 'Run the database-free subset required before a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify checked-out source
        if: ${{ inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/bash deploy/tests/install-github-token-test.sh
          /bin/bash deploy/tests/intent-classifier-deploy-test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify checked-out source
        if: ${{ inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        if: ${{ inputs.release_gate != true }}
        working-directory: backend
        env:
          # Only allow disposable containers on the GitHub-hosted CI runner.
          SUB2API_VALIDATION_MODE: ci-container
          SUB2API_ALLOW_LEGACY_CI_CONTAINERS: ALLOW
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify checked-out source
        if: ${{ inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend complete code gate
        working-directory: frontend
        run: |
          pnpm run typecheck
          pnpm run test:run
          pnpm run lint:check
          pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify checked-out source
        if: ${{ inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
