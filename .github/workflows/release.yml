name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to release (e.g., v0.2.1-P1)'
        required: true
        type: string
        default: 'v0.2.1-P1'
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      promote_latest:
        description: 'Also move latest to this tag (manual runs default to false)'
        required: false
        type: boolean
        default: false

# Only workflow_dispatch may opt into a simple release.
# Tag pushes always use the full config so archives and checksums are generated.
env:
  SIMPLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.simple_release }}
  PROMOTE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}

permissions:
  contents: write
  packages: write

jobs:
  resolve-target:
    name: Resolve release tag and commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify target tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${DISPATCH_TAG}"
          else
            TAG_NAME="${REF_NAME}"
          fi

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG_NAME}" >&2
            exit 1
          fi

          git fetch --force --tags
          if ! TARGET_SHA="$(git rev-parse --verify --quiet "${TAG_NAME}^{commit}")"; then
            echo "Release tag does not resolve to a commit: ${TAG_NAME}" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "push" && "${TARGET_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "Tag target ${TARGET_SHA} does not match workflow SHA ${WORKFLOW_SHA}" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          printf 'tag=%s\n' "${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'target_sha=%s\n' "${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

  # Update VERSION file with tag version
  update-version:
    needs: resolve-target
    outputs:
      source_sha: ${{ steps.verify_source.outputs.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          fetch-depth: 1

      - name: Update VERSION file
        id: verify_source
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          TARGET_VERSION: ${{ needs.resolve-target.outputs.version }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${TARGET_SHA}" ]]; then
            echo "VERSION source SHA ${SOURCE_SHA} does not match target ${TARGET_SHA}" >&2
            exit 1
          fi
          printf '%s\n' "${TARGET_VERSION}" > backend/cmd/server/VERSION
          VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "${VERSION}" != "${TARGET_VERSION}" ]]; then
            echo "VERSION file ${VERSION} does not match target version ${TARGET_VERSION}" >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Updated VERSION file to: ${VERSION} from ${SOURCE_SHA}"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file-${{ needs.resolve-target.outputs.target_sha }}
          path: backend/cmd/server/VERSION
          if-no-files-found: error
          retention-days: 1

      - name: Record VERSION source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.verify_source.outputs.source_sha }}
        run: printf '%s\n' "${SOURCE_SHA}" > version-source.sha

      - name: Upload VERSION source marker
        uses: actions/upload-artifact@v7
        with:
          name: version-source-${{ needs.resolve-target.outputs.target_sha }}
          path: version-source.sha
          if-no-files-found: error
          retention-days: 1

  build-frontend:
    needs: resolve-target
    outputs:
      source_sha: ${{ steps.verify_source.outputs.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          fetch-depth: 1

      - name: Verify frontend source SHA
        id: verify_source
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${TARGET_SHA}" ]]; then
            echo "Frontend source SHA ${SOURCE_SHA} does not match target ${TARGET_SHA}" >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ needs.resolve-target.outputs.target_sha }}
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Record frontend source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.verify_source.outputs.source_sha }}
        run: printf '%s\n' "${SOURCE_SHA}" > frontend-source.sha

      - name: Upload frontend source marker
        uses: actions/upload-artifact@v7
        with:
          name: frontend-source-${{ needs.resolve-target.outputs.target_sha }}
          path: frontend-source.sha
          if-no-files-found: error
          retention-days: 1

  # Reuse the normal CI and security workflows as release gates. Each called
  # workflow checks out the exact target SHA supplied here.
  backend-ci:
    name: Backend CI release gate
    needs: resolve-target
    uses: ./.github/workflows/backend-ci.yml
    with:
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
      release_gate: true

  security-scan:
    name: Security release gate
    needs: resolve-target
    uses: ./.github/workflows/security-scan.yml
    with:
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}

  intent-classifier:
    name: Intent classifier release gate
    needs: [resolve-target, backend-ci, security-scan]
    uses: ./.github/workflows/publish-intent-classifier-ghcr.yml
    with:
      tag: ${{ needs.resolve-target.outputs.tag }}
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
      simple_release: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simple_release == 'true' }}
      promote_latest: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.promote_latest == 'true' }}

  release:
    needs: [resolve-target, update-version, build-frontend, backend-ci, security-scan, intent-classifier]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file-${{ needs.resolve-target.outputs.target_sha }}
          path: backend/cmd/server/

      - name: Download VERSION source marker
        uses: actions/download-artifact@v8
        with:
          name: version-source-${{ needs.resolve-target.outputs.target_sha }}
          path: .release-metadata/version/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ needs.resolve-target.outputs.target_sha }}
          path: backend/internal/web/dist/

      - name: Download frontend source marker
        uses: actions/download-artifact@v8
        with:
          name: frontend-source-${{ needs.resolve-target.outputs.target_sha }}
          path: .release-metadata/frontend/

      - name: Verify release source and prerequisite artifacts
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          TARGET_VERSION: ${{ needs.resolve-target.outputs.version }}
          VERSION_JOB_SHA: ${{ needs.update-version.outputs.source_sha }}
          FRONTEND_JOB_SHA: ${{ needs.build-frontend.outputs.source_sha }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${TARGET_SHA}" ]]; then
            echo "Release checkout SHA ${SOURCE_SHA} does not match target ${TARGET_SHA}" >&2
            exit 1
          fi
          if [[ "${VERSION_JOB_SHA}" != "${TARGET_SHA}" || "${FRONTEND_JOB_SHA}" != "${TARGET_SHA}" ]]; then
            echo "A prerequisite job did not use target SHA ${TARGET_SHA}" >&2
            exit 1
          fi
          if [[ "$(tr -d '\r\n' < backend/cmd/server/VERSION)" != "${TARGET_VERSION}" ]]; then
            echo "Downloaded VERSION does not match target version ${TARGET_VERSION}" >&2
            exit 1
          fi
          if [[ "$(tr -d '\r\n' < .release-metadata/version/version-source.sha)" != "${TARGET_SHA}" ]]; then
            echo "VERSION artifact source marker does not match target ${TARGET_SHA}" >&2
            exit 1
          fi
          if [[ "$(tr -d '\r\n' < .release-metadata/frontend/frontend-source.sha)" != "${TARGET_SHA}" ]]; then
            echo "Frontend artifact source marker does not match target ${TARGET_SHA}" >&2
            exit 1
          fi

      - name: Remove release verification metadata
        run: |
          rm -rf -- .release-metadata
          test ! -e .release-metadata

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        env:
          TAG_NAME: ${{ needs.resolve-target.outputs.tag }}
        run: |
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          # 使用 EOF 分隔符处理多行内容
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
          PROMOTE_LATEST: ${{ env.PROMOTE_LATEST }}

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME=${{ github.event.inputs.tag }}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE='${{ steps.tag_message.outputs.message }}'
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/personal_sub2)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
